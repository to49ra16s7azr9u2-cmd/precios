# Actualiza los precios guardados del catálogo contra todas las tiendas que
# se pueden leer sin API oficial (Mercado Libre, Elektra, GeekBuying,
# SUNSKY, Whirlpool, theluxurycloset, Glasseslit), todos los días, y publica
# el resultado.
#
# POR QUÉ HACE FALTA
# ------------------
# La ficha de producto ya refrescaba precios en vivo AL ABRIRLA (ver
# refreshLiveOffers en js/app.js), pero eso solo arregla esa página: la
# portada, los rankings, las listas por categoría y las ~84,000 páginas
# estáticas de SEO se pintan con lo que hay guardado en data/. Ese guardado
# solo se actualizaba corriendo scripts/refresh_prices.py A MANO -- o sea,
# casi nunca. Medido sobre una muestra de 18 productos de Mercado Libre del
# catálogo: 8 seguían bien, 6 estaban desfasados (hasta -26%) y 4 ya ni se
# vendían. Un comparador que publica un precio y al hacer clic muestra otro
# es exactamente lo que no debe pasar, así que esto pasa a correr solo.
#
# POR QUÉ TAMBIÉN ELEKTRA
# -----------------------
# Mercado Libre son 8,119 de los 83,438 productos (9%). Elektra es el 85%
# (70,953) y se refrescaba solo corriendo refresh_elektra.py a mano, o sea
# casi nunca -- justo la parte más grande del catálogo era la más vieja.
# Con este paso, el 94% del catálogo se actualiza solo todos los días, que
# es lo que la portada y la meta description del sitio prometen.
#
# Es barato: no pide producto por producto, re-recorre las 95 categorías de
# la API pública de VTEX de a 50 productos (~1,500 pedidos). Medido en 4
# categorías tardó 80s, o sea ~32 min para las 95.
#
# No hace falta ningún secreto: refresh_prices.py habla con el Worker
# público (backend/mercadolibre-worker), no con la API de Mercado Libre
# directamente -- las credenciales viven en el Worker, no acá.
name: Actualizar precios

on:
  schedule:
    # 09:00 UTC = 03:00 en Ciudad de México: fuera de hora pico de visitas, y
    # el commit queda publicado antes de que empiece el día.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Máximo de productos a revisar (0 = todos)"
        required: false
        default: "0"
      prune:
        description: "Sacar del catálogo lo que ya no se vende"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

# Dos corridas a la vez se pisarían el commit (las dos escriben data/ y
# 84,000 páginas). Si ya hay una corriendo, la nueva espera: cancelar la que
# está en curso tiraría las dos horas de lectura de tiendas que ya lleva.
concurrency:
  group: refresh-precios
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # ~8,200 productos de Mercado Libre a 4 en paralelo (~1 h), el recorrido
    # de Elektra (~32 min), las 1,679 fichas de las demás tiendas (~13 min)
    # y la regeneración de las páginas SEO. El tope es holgado para que un
    # día lento no la corte por la mitad.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Actualizar precios contra Mercado Libre
        # Los inputs se leen por variable de entorno y se decide en shell: en
        # una corrida por horario `inputs` viene vacío, y la comparación de
        # GitHub `inputs.prune == false` daría TRUE con un valor vacío --
        # o sea, desactivaría la poda justo en las corridas automáticas, que
        # es lo contrario de lo que se quiere.
        env:
          LIMIT: ${{ inputs.limit }}
          PRUNE: ${{ inputs.prune }}
        run: |
          ARGS="--limit ${LIMIT:-0}"
          if [ "$PRUNE" = "false" ]; then ARGS="$ARGS --no-prune"; fi
          echo "Corriendo: refresh_prices.py $ARGS"
          python3 scripts/refresh_prices.py $ARGS

      - name: Actualizar precios contra Elektra
        # continue-on-error a propósito: refresh_elektra.py sale con 2
        # cuando el recorrido cubre menos de la mitad del catálogo (señal de
        # que la API de VTEX respondió mal, ver MIN_WALK_RATIO). Ese caso no
        # debe tirar el job entero -- si lo hiciera, un hipo de Elektra
        # descartaría también el refresco de Mercado Libre que ya terminó,
        # porque los pasos de abajo (SEO + commit) no correrían. Falla
        # visible en la UI, pero el resto se publica igual.
        continue-on-error: true
        env:
          PRUNE: ${{ inputs.prune }}
        run: |
          ARGS=""
          if [ "$PRUNE" = "false" ]; then ARGS="--no-prune"; fi
          echo "Corriendo: refresh_elektra.py $ARGS"
          python3 scripts/refresh_elektra.py $ARGS

      - name: Actualizar precios de las demás tiendas
        # GeekBuying, SUNSKY, Whirlpool, theluxurycloset y Glasseslit: 1,679
        # productos (2% del catálogo) que hasta ahora solo se refrescaban a
        # mano. Son las tiendas sin API cuya página sí trae JSON-LD o
        # og:price legible; Amazon, AliExpress y Alibaba NO están y no pueden
        # estar (ver el encabezado de refresh_other_stores.py: Amazon no
        # tiene API abierta, AliExpress redirige a otro id de producto según
        # la región y Alibaba cotiza por cantidad).
        #
        # Mismo continue-on-error que Elektra y por lo mismo: si el tipo de
        # cambio USD/MXN no responde el script sale con 2, y eso no debe
        # descartar los dos refrescos grandes que ya terminaron.
        continue-on-error: true
        env:
          PRUNE: ${{ inputs.prune }}
        run: |
          ARGS=""
          if [ "$PRUNE" = "false" ]; then ARGS="--no-prune"; fi
          echo "Corriendo: refresh_other_stores.py $ARGS"
          python3 scripts/refresh_other_stores.py $ARGS

      - name: Anotar el precio del día en el historial
        # ANTES de las facetas y del SEO, y después de los tres refrescos:
        # este paso es el único del workflow cuyo dato NO se puede rehacer
        # después. Si se saltea un día, ese día se pierde para siempre --el
        # precio viejo ya fue sobreescrito-- mientras que las facetas y las
        # páginas se pueden regenerar cuando sea.
        # Por eso NO lleva continue-on-error: si esto falla, hay que verlo.
        run: python3 scripts/record_price_history.py

      - name: Recalcular facetas (filtros de specs)
        # Los precios no cambian las specs, pero la poda sí puede sacar
        # productos: sin esto los conteos por categoría del manifiesto
        # quedarían contando productos que ya no están.
        run: python3 scripts/compute_facets.py

      - name: Regenerar páginas estáticas SEO
        # Las páginas de producto/categoría llevan el precio dentro del HTML,
        # así que hay que rehacerlas. generate_seo_pages.py solo reescribe
        # las que de verdad cambiaron (ver write_if_changed), así que el
        # commit muestra únicamente lo que se movió.
        run: python3 scripts/generate_seo_pages.py

      - name: Publicar los cambios
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Ningún precio cambió; no hay nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Los precios que consiguió esta corrida, por url de oferta, ANTES
          # de tocar git: si el rebase choca hay que poder volver a
          # aplicarlos sobre el main nuevo. Ver scripts/precios_de_ofertas.py.
          python3 scripts/precios_de_ofertas.py --guardar "$RUNNER_TEMP/precios-corrida.json"
          git add -A
          git commit -m "Actualizar precios de todas las tiendas leíbles (automático)

          Corrida automática de scripts/refresh_prices.py +
          refresh_elektra.py + refresh_other_stores.py +
          record_price_history.py + compute_facets.py +
          generate_seo_pages.py. Ver el log del workflow para el resumen
          de cuántos precios se movieron y qué se podó."
          # La corrida dura ~2 h: si en el medio se pushó algo a main, se
          # reintenta sobre eso en vez de fallar.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            # Un rebase que choca deja el árbol a medias, y entonces TODOS
            # los reintentos mueren con "Pulling is not possible because you
            # have unmerged files" sin haber intentado nada. Así se
            # perdieron las tres corridas programadas que hubo: dos horas de
            # trabajo hecho y tirado. Se deshace antes de reintentar.
            git rebase --abort 2>/dev/null || true
            echo "Reintento $i..."
            sleep 15
          done

          # Chocó de verdad. Cada archivo de data/cat es UNA línea de JSON,
          # así que dos cambios en la misma categoría no se juntan solos y no
          # hay rebase que valga. Se parte del main de verdad --que puede
          # traer fichas fusionadas o dadas de baja-- y se le vuelven a
          # aplicar SOLO los precios de esta corrida, sin resucitar nada, y
          # se rehace lo que se deriva de ellos.
          echo "El rebase chocó con main; se reaplican los precios encima."
          git rebase --abort 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/precios_de_ofertas.py --aplicar "$RUNNER_TEMP/precios-corrida.json"
          python3 scripts/record_price_history.py
          python3 scripts/compute_facets.py
          python3 scripts/generate_seo_pages.py
          if [ -z "$(git status --porcelain)" ]; then
            echo "Sobre el main nuevo no queda ningún cambio que publicar."
            exit 0
          fi
          git add -A
          git commit -m "Actualizar precios de todas las tiendas leíbles (automático)

          Reaplicados sobre un main que se movió durante la corrida (ver
          scripts/precios_de_ofertas.py): se conservan los precios leídos y
          se respeta lo que main haya cambiado en el catálogo."
          git push origin main
