# Actualiza los precios guardados del catálogo contra todas las tiendas que
# se pueden leer sin API oficial (Mercado Libre, Elektra, Chedraui, Martí,
# GeekBuying, SUNSKY, Whirlpool, theluxurycloset, Glasseslit), todos los
# días, y publica el resultado.
#
# POR QUÉ HACE FALTA
# ------------------
# La ficha de producto ya refrescaba precios en vivo AL ABRIRLA (ver
# refreshLiveOffers en js/app.js), pero eso solo arregla esa página: la
# portada, los rankings, las listas por categoría y las ~84,000 páginas
# estáticas de SEO se pintan con lo que hay guardado en data/. Ese guardado
# solo se actualizaba corriendo scripts/refresh_prices.py A MANO -- o sea,
# casi nunca. Medido sobre una muestra de 18 productos de Mercado Libre del
# catálogo: 8 seguían bien, 6 estaban desfasados (hasta -26%) y 4 ya ni se
# vendían. Un comparador que publica un precio y al hacer clic muestra otro
# es exactamente lo que no debe pasar, así que esto pasa a correr solo.
#
# POR QUÉ TAMBIÉN ELEKTRA
# -----------------------
# Mercado Libre son 8,119 de los 83,438 productos (9%). Elektra es el 85%
# (70,953) y se refrescaba solo corriendo refresh_elektra.py a mano, o sea
# casi nunca -- justo la parte más grande del catálogo era la más vieja.
# Con este paso, el 94% del catálogo se actualiza solo todos los días, que
# es lo que la portada y la meta description del sitio prometen.
#
# Es barato: no pide producto por producto, re-recorre las 95 categorías de
# la API pública de VTEX de a 50 productos (~1,500 pedidos). Medido en 4
# categorías tardó 80s, o sea ~32 min para las 95.
#
# No hace falta ningún secreto: refresh_prices.py habla con el Worker
# público (backend/mercadolibre-worker), no con la API de Mercado Libre
# directamente -- las credenciales viven en el Worker, no acá.
#
# DESDE EL 26-SEP-2026
# --------------------
# Con el catálogo en 928 mil fichas la corrida ya no terminaba: pasaba las
# 5 h en el paso de Mercado Libre (recorría todas las fichas y guardaba cada
# 100) y se cancelaba sin publicar nada. Ahora:
#   - Mercado Libre revisa sólo sus ~65 mil fichas y con tope diario
#     (--tope-diario): una tajada por día, todas en dos días, sin pasar el
#     límite de 100 mil pedidos por día del Worker.
#   - Walmart, Bodega Aurrerá, Sam's, Sephora, Lenovo y Reuse (el 80% de las
#     ofertas) se actualizan desde los feeds de Soicos (soicos_precios.py).
#     La bajada es casi toda espera de red, así que corre en segundo plano
#     mientras se refrescan las demás tiendas. Necesita los secretos
#     SOICOS_TOKEN y SOICOS_AID del repositorio; sin ellos se saltea.
#   - Después de los precios se rehacen también los índices de búsqueda,
#     que llevan el precio.
name: Actualizar precios

on:
  schedule:
    # 09:00 UTC = 03:00 en Ciudad de México: fuera de hora pico de visitas, y
    # el commit queda publicado antes de que empiece el día.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Máximo de productos a revisar (0 = todos)"
        required: false
        default: "0"
      prune:
        # Apagado por decisión del sitio (ver README, "Qué NO hace"): un
        # producto agotado o retirado se queda con su ficha y su historial de
        # precios. Solo se enciende a mano, para una limpieza puntual.
        description: "Sacar del catálogo lo que ya no se vende (normalmente NO)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Dos corridas a la vez se pisarían el commit (las dos escriben data/ y
# 84,000 páginas). Si ya hay una corriendo, la nueva espera: cancelar la que
# está en curso tiraría las dos horas de lectura de tiendas que ya lleva.
concurrency:
  group: refresh-precios
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Una tajada de Mercado Libre (~34 mil consultas a 4 en paralelo, ~70
    # min), las tres tiendas VTEX (~45 min) y las demás (~13 min), con los
    # feeds de Soicos bajando a la par (~2 h, tope 170 min); después
    # historial, facetas, páginas e índices. El tope es holgado para que un
    # día lento no la corte por la mitad.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bajar los feeds de Soicos (en segundo plano)
        # Sólo baja precios a un archivo, sin tocar el catálogo, así puede
        # correr a la par de los refrescos de abajo. Se aplica más adelante,
        # en «Aplicar los precios de Soicos».
        env:
          SOICOS_TOKEN: ${{ secrets.SOICOS_TOKEN }}
          SOICOS_AID: ${{ secrets.SOICOS_AID }}
        run: |
          nohup python3 scripts/soicos_precios.py --bajar "$RUNNER_TEMP/soicos.json.gz" --minutos 170 \
            > "$RUNNER_TEMP/soicos.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/soicos.pid"

      - name: Descubrir productos nuevos en Mercado Libre
        # Una ventana de subcategorías por día (ver ml_discover.py): busca
        # en el catálogo de Mercado Libre lo que todavía no tenemos y lo da
        # de alta con categoría. Va ANTES del refresco para que lo nuevo
        # entre con precio del día, historial, facetas y página en la misma
        # corrida. Si el Worker no responde, el resto sigue igual.
        continue-on-error: true
        run: |
          python3 scripts/ml_discover.py
          python3 scripts/clasificar_subcategorias.py
          python3 scripts/classify_cargadores.py
          # Lo que ninguna regla supo repartir entra sin subcategoría (así
          # llegaban cientos por día): los vecinos del catálogo la llenan
          # donde aciertan >= 85% (ver completar_subcategorias.py).
          python3 scripts/completar_subcategorias.py --aplicar
          python3 scripts/sync_subcategories.py

      - name: Fusionar los duplicados que entraron
        # Lo nuevo de Mercado Libre y de los feeds suele ser un producto que
        # ya estaba (mismo nombre en otra tienda, otro color del mismo
        # equipo, la misma publicación con otra foto). Sin esto se acumulaban
        # fichas repetidas entre una regeneración completa y la siguiente.
        # Las absorbidas redirigen a la que quedó (build_retirados_index).
        continue-on-error: true
        run: |
          python3 scripts/merge_cross_store.py | tail -2
          python3 scripts/merge_by_color.py | tail -2
          python3 scripts/merge_misma_foto.py --muestra 0 | tail -2
          python3 scripts/build_retirados_index.py | tail -2

      - name: Actualizar precios contra Mercado Libre
        # Los inputs se leen por variable de entorno y se decide en shell.
        # La poda va APAGADA salvo que se pida a mano (inputs.prune=true):
        # los scripts la traen encendida por defecto, pero el sitio promete
        # que nada se borra por agotarse. En una corrida por horario
        # `inputs` viene vacío y la comparación con "true" da falso, que es
        # justo lo que se quiere.
        # Si el Worker no responde, las demás tiendas (y Soicos, que ya
        # está bajando) se publican igual.
        continue-on-error: true
        env:
          LIMIT: ${{ inputs.limit }}
          PRUNE: ${{ inputs.prune }}
        run: |
          ARGS="--limit ${LIMIT:-0} --tope-diario 34000"
          if [ "$PRUNE" != "true" ]; then ARGS="$ARGS --no-prune"; fi
          echo "Corriendo: refresh_prices.py $ARGS"
          python3 scripts/refresh_prices.py $ARGS

      - name: Actualizar precios contra Elektra y Martí (VTEX)
        # Las tres tiendas corren sobre VTEX y se refrescan con el mismo
        # script (refresh_vtex.py, ver vtex_stores.py). Cada una sale con 2
        # cuando su recorrido cubre menos de la mitad de sus urls del
        # catálogo (señal de que la API respondió mal, ver MIN_WALK_RATIO):
        # ese caso no debe tirar ni el job ni a las otras dos tiendas -- si
        # lo hiciera, un hipo de Elektra descartaría también el refresco de
        # Mercado Libre que ya terminó, porque los pasos de abajo (SEO +
        # commit) no correrían. Por eso el `|| echo` por tienda y el
        # continue-on-error del paso: falla visible en el log, pero el resto
        # se publica igual.
        continue-on-error: true
        env:
          PRUNE: ${{ inputs.prune }}
        run: |
          ARGS=""
          if [ "$PRUNE" != "true" ]; then ARGS="--no-prune"; fi
          # Chedraui no: sus términos prohíben reproducir su contenido sin
          # permiso escrito (SIN_AUTORIZACION en vtex_stores.py).
          for TIENDA in elektra marti; do
            echo "Corriendo: refresh_vtex.py --store $TIENDA $ARGS"
            python3 scripts/refresh_vtex.py --store "$TIENDA" $ARGS || echo "AVISO: el refresco de $TIENDA no se aplicó (salida $?)"
          done

      - name: Actualizar precios de las demás tiendas
        # GeekBuying, SUNSKY, Whirlpool, theluxurycloset y Glasseslit: 1,679
        # productos (2% del catálogo) que hasta ahora solo se refrescaban a
        # mano. Son las tiendas sin API cuya página sí trae JSON-LD o
        # og:price legible; Amazon, AliExpress y Alibaba NO están y no pueden
        # estar (ver el encabezado de refresh_other_stores.py: Amazon no
        # tiene API abierta, AliExpress redirige a otro id de producto según
        # la región y Alibaba cotiza por cantidad).
        #
        # Mismo continue-on-error que Elektra y por lo mismo: si el tipo de
        # cambio USD/MXN no responde el script sale con 2, y eso no debe
        # descartar los dos refrescos grandes que ya terminaron.
        continue-on-error: true
        env:
          PRUNE: ${{ inputs.prune }}
        run: |
          ARGS=""
          if [ "$PRUNE" != "true" ]; then ARGS="--no-prune"; fi
          echo "Corriendo: refresh_other_stores.py $ARGS"
          python3 scripts/refresh_other_stores.py $ARGS

      - name: Aplicar los precios de Soicos
        # Espera a que termine la bajada (tiene su propio tope de 170 min) y
        # aplica todo con una sola carga del catálogo. Si la bajada no dejó
        # archivo (sin secretos, API caída), no cambia nada.
        continue-on-error: true
        run: |
          PID=$(cat "$RUNNER_TEMP/soicos.pid")
          while kill -0 "$PID" 2>/dev/null; do sleep 30; done
          cat "$RUNNER_TEMP/soicos.log"
          python3 scripts/soicos_precios.py --aplicar "$RUNNER_TEMP/soicos.json.gz"

      - name: Anotar el precio del día en el historial
        # ANTES de las facetas y del SEO, y después de los tres refrescos:
        # este paso es el único del workflow cuyo dato NO se puede rehacer
        # después. Si se saltea un día, ese día se pierde para siempre --el
        # precio viejo ya fue sobreescrito-- mientras que las facetas y las
        # páginas se pueden regenerar cuando sea.
        # Por eso NO lleva continue-on-error: si esto falla, hay que verlo.
        run: python3 scripts/record_price_history.py

      - name: Recalcular facetas (filtros de specs)
        # Los precios no cambian las specs, pero la poda sí puede sacar
        # productos: sin esto los conteos por categoría del manifiesto
        # quedarían contando productos que ya no están.
        run: |
          python3 scripts/compute_facets.py
          python3 scripts/compute_quality_axes.py

      - name: Regenerar páginas estáticas SEO
        # Las páginas de producto/categoría llevan el precio dentro del HTML,
        # así que hay que rehacerlas. generate_seo_pages.py solo reescribe
        # las que de verdad cambiaron (ver write_if_changed), así que el
        # commit muestra únicamente lo que se movió.
        run: python3 scripts/generate_seo_pages.py

      - name: Rehacer los índices de búsqueda
        # El buscador y las listas por palabra llevan el precio de cada ficha.
        run: |
          python3 scripts/build_search_index.py
          python3 scripts/build_buscador.py
          python3 scripts/comprimir_datos.py

      - name: Publicar los cambios
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Ningún precio cambió; no hay nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Los precios que consiguió esta corrida, por url de oferta, ANTES
          # de tocar git: si el rebase choca hay que poder volver a
          # aplicarlos sobre el main nuevo. Ver scripts/precios_de_ofertas.py.
          python3 scripts/precios_de_ofertas.py --guardar "$RUNNER_TEMP/precios-corrida.json"
          git add -A
          git commit -m "Actualizar precios de todas las tiendas leíbles (automático)

          Corrida automática de scripts/refresh_prices.py +
          refresh_vtex.py + refresh_other_stores.py + soicos_precios.py +
          record_price_history.py + compute_facets.py +
          generate_seo_pages.py. Ver el log del workflow para el resumen
          de cuántos precios se movieron y qué se podó."
          # La corrida dura ~2 h: si en el medio se pushó algo a main, se
          # reintenta sobre eso en vez de fallar.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            # Un rebase que choca deja el árbol a medias, y entonces TODOS
            # los reintentos mueren con "Pulling is not possible because you
            # have unmerged files" sin haber intentado nada. Así se
            # perdieron las tres corridas programadas que hubo: dos horas de
            # trabajo hecho y tirado. Se deshace antes de reintentar.
            git rebase --abort 2>/dev/null || true
            echo "Reintento $i..."
            sleep 15
          done

          # Chocó de verdad. Cada archivo de data/cat es UNA línea de JSON,
          # así que dos cambios en la misma categoría no se juntan solos y no
          # hay rebase que valga. Se parte del main de verdad --que puede
          # traer fichas fusionadas o dadas de baja-- y se le vuelven a
          # aplicar SOLO los precios de esta corrida, sin resucitar nada, y
          # se rehace lo que se deriva de ellos.
          echo "El rebase chocó con main; se reaplican los precios encima."
          git rebase --abort 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/precios_de_ofertas.py --aplicar "$RUNNER_TEMP/precios-corrida.json"
          python3 scripts/record_price_history.py
          python3 scripts/compute_facets.py
          python3 scripts/compute_quality_axes.py
          python3 scripts/generate_seo_pages.py
          python3 scripts/build_search_index.py
          python3 scripts/build_buscador.py
          python3 scripts/comprimir_datos.py
          if [ -z "$(git status --porcelain)" ]; then
            echo "Sobre el main nuevo no queda ningún cambio que publicar."
            exit 0
          fi
          git add -A
          git commit -m "Actualizar precios de todas las tiendas leíbles (automático)

          Reaplicados sobre un main que se movió durante la corrida (ver
          scripts/precios_de_ofertas.py): se conservan los precios leídos y
          se respeta lo que main haya cambiado en el catálogo."
          git push origin main
