<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Ilustración de la fachada de la tienda Demo">
  <title>Fachada de la tienda Demo (ilustración)</title>
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#d9f1fb"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe9f1"/>
      <stop offset="1" stop-color="#9cc9d8"/>
    </linearGradient>
    <linearGradient id="refri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f6f7"/>
      <stop offset="1" stop-color="#c9d1d6"/>
