  <path d="M248 318 h24 l-4 22 h-16z" fill="#c8693a"/>
  <path d="M260 318 q-14 -22 -4 -34 q2 16 4 34z M260 318 q14 -24 6 -38 q-4 18 -6 38z M260 318 q-2 -26 0 -40 q4 20 0 40z" fill="#3f9b5a"/>
  <path d="M368 318 h24 l-4 22 h-16z" fill="#c8693a"/>
  <path d="M380 318 q-14 -22 -4 -34 q2 16 4 34z M380 318 q14 -24 6 -38 q-4 18 -6 38z M380 318 q-2 -26 0 -40 q4 20 0 40z" fill="#3f9b5a"/>
