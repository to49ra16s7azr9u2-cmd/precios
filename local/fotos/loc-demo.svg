  <g stroke="#b3ac9f" stroke-width="2"><line x1="80" y1="346" x2="60" y2="400"/><line x1="220" y1="346" x2="210" y2="400"/><line x1="360" y1="346" x2="365" y2="400"/><line x1="500" y1="346" x2="515" y2="400"/></g>
