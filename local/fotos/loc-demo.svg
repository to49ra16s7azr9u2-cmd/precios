  <text x="320" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#6b4f3a">ABIERTO</text>
  <circle cx="312" cy="266" r="2.5" fill="#ffd166"/><circle cx="328" cy="266" r="2.5" fill="#ffd166"/>
