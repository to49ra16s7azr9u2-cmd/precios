    <path d="M214 102 h22 v18 l-5 -4 -6 4 -6 -4 -5 4z" fill="#f28c28"/>
    <path d="M252 99 h22 v18 l-5 -4 -6 4 -6 -4 -5 4z" fill="#1a8f4c"/>
    <path d="M366 99 h22 v18 l-5 -4 -6 4 -6 -4 -5 4z" fill="#d62839"/>
    <path d="M404 102 h22 v18 l-5 -4 -6 4 -6 -4 -5 4z" fill="#ffd166"/>
    <path d="M442 103 h22 v18 l-5 -4 -6 4 -6 -4 -5 4z" fill="#2bb3a3"/>
    <path d="M480 102 h22 v18 l-5 -4 -6 4 -6 -4 -5 4z" fill="#7b61c4"/>
